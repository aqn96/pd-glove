# Local-only Mosquitto config for D3 MQTT/security testing.
# Anonymous, unauthenticated, no TLS -- this is a local dev broker for
# pipeline testing, not a production configuration. TLS 1.3 + mutual cert
# auth (the paper's actual security design) is a documented stretch goal,
# not implemented here.
listener 1883
allow_anonymous true
persistence true
persistence_location /tmp/mosquitto_pd_glove/
